# Runs k6 in Docker, for machines where the k6 CLI cannot be installed (Windows / limited privileges).
#   docker compose up                                   -> performance plan
#   SCRIPT=seed-data.js docker compose up               -> create test data first
# The API must be running on your machine (port 8080).
services:
  k6:
    image: grafana/k6:latest
    volumes:
      - .:/apps:rw
    command: run /apps/${SCRIPT:-order-performance-plan.js}
    ports:
      - "5665:5665" # Live dashboard: http://localhost:5665 while the test runs
    environment:
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_EXPORT=/apps/report.html
      # The PDF uses network_mode: host, which does not work with Docker Desktop on Windows/macOS.
      # host.docker.internal is how a container reaches the machine it runs on.
      - BASE_URL=${BASE_URL:-http://host.docker.internal:8080/api/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Also makes host.docker.internal work on Linux
