spring.application.name=bootcamp
server.servlet.context-path=/api/v1
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Database Connectivity
spring.datasource.url=jdbc:postgresql://localhost:5432/order_manager
spring.datasource.username=franck
spring.datasource.password=root

# Hibernate / JPA
# IMPORTANT: We disable automatic generation because Flyway is in charge!
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Settings
spring.flyway.baseline-on-migrate=true

# Mail (Mailpit in development: SMTP on 1025, web UI on http://localhost:8025)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# OpenAPI / Swagger UI (served under the context path: http://localhost:8080/api/v1/swagger-ui.html)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.openapi.info.title=Bootcamp Manager API
springdoc.openapi.info.version=1.0.0
springdoc.openapi.info.description=Bootcamp API
# Login from Swagger UI ("Authorize" > oauth2)
bootcamp.openapi.oauth2-base-url=${OPENAPI_OAUTH2_BASE_URL:http://127.0.0.1:8080/api/v1}
springdoc.swagger-ui.oauth.client-id=${spring.security.oauth2.swagger-client-id}
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=read

# Security / OAuth2
spring.security.oauth2.client-id=${SECURITY_OAUTH2_CLIENT_ID:localClientId}
spring.security.oauth2.client-secret=${SECURITY_OAUTH2_CLIENT_SECRET:localClientSecret}
spring.security.oauth2.redirect-uri=${SECURITY_OAUTH2_REDIRECT_URI:http://127.0.0.1:8080/api/v1/authorized}
# Swagger UI logs in as a public client (no secret, PKCE). Open it on 127.0.0.1: "localhost" redirects are refused
spring.security.oauth2.swagger-client-id=${SECURITY_OAUTH2_SWAGGER_CLIENT_ID:swagger-ui}
spring.security.oauth2.swagger-redirect-uri=${SECURITY_OAUTH2_SWAGGER_REDIRECT_URI:http://127.0.0.1:8080/api/v1/swagger-ui/oauth2-redirect.html}
spring.security.oauth2.access-token-validity-minutes=30
spring.security.oauth2.refresh-token-validity-days=7

# Cache : orders are cached in Valkey, a Redis-compatible key/value store
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Fail fast if Valkey is down: the API then reads from the database instead (see CacheConfig)
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
bootcamp.cache.time-to-live=10m
